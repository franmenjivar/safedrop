<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SafeDrop — how it works</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Michroma&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Saira:wght@500;600;700&display=swap">
<style>
/* SafeDrop — volumetric teal. One accent only: the aircraft's light band.
   Committed dark by intent; an aircraft at night is a dark object. Every
   colour painted explicitly so the page holds on any host ground. */
:root {
  --abyss:   #080D0C;
  --fog-0:   #0D1514;
  --fog-1:   #16211F;
  --fog-2:   #23312E;
  --fog-3:   #33443F;

  --glass:   rgba(255, 255, 255, .045);
  --glass-2: rgba(255, 255, 255, .075);
  --edge:    rgba(255, 255, 255, .12);
  --edge-lit:rgba(255, 255, 255, .26);

  --cyan:      #35DCD8;
  --cyan-soft: rgba(53, 220, 216, .15);
  --beam:      #E8FBFA;
  --ember:     #C9705C;

  --pass:    #4FD69C;
  --fail:    #FF7A72;
  --caution: #F0B65E;

  --text:  #EAF1F0;
  --muted: #9BAEAB;
  --faint: #6A7E7B;

  --display: Michroma, "Saira", ui-sans-serif, system-ui, sans-serif;
  --head: Saira, ui-sans-serif, system-ui, sans-serif;
  --body: "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;

  --r: 18px;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

body {
  margin: 0;
  background: var(--abyss);
  color: var(--text);
  font: 400 17px/1.7 var(--body);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

.wrap { max-width: 66rem; margin: 0 auto; padding: 0 1.5rem; position: relative; z-index: 1; }
.col { max-width: 42rem; }

h2, h3 { font-family: var(--head); margin: 0; text-wrap: balance; }
h2 { font-weight: 600; font-size: clamp(1.7rem, 3.5vw, 2.5rem); line-height: 1.12; letter-spacing: -.012em; }
h3 { font-weight: 600; font-size: 1.04rem; line-height: 1.3; }

p { margin: 0; }
.col > * + * { margin-top: 1.15rem; }
strong { font-weight: 600; color: #F6FBFA; }

.eyebrow {
  font-family: var(--mono); font-size: .68rem; font-weight: 500;
  letter-spacing: .24em; text-transform: uppercase; color: var(--cyan);
  display: flex; align-items: center; gap: .75rem;
}
.eyebrow::before { content: ""; width: 24px; height: 1px; background: var(--cyan); opacity: .7; flex: none; }

.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

section { padding: clamp(4rem, 9vw, 7rem) 0; position: relative; }
section + section::before {
  content: ""; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
  width: min(66rem, calc(100% - 3rem)); height: 1px;
  background: linear-gradient(90deg, transparent, var(--edge) 20%, var(--edge) 80%, transparent);
}

/* ---------- hero: framed glass composition ---------- */

.stage { padding: 1.1rem; position: relative; }
#sky { position: absolute; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; }

.frame {
  position: relative;
  min-height: min(92svh, 860px);
  border-radius: 26px;
  border: 1px solid var(--edge-lit);
  overflow: hidden;
  display: flex; flex-direction: column;
  box-shadow: 0 40px 120px -40px rgba(0, 0, 0, .9), inset 0 1px 0 rgba(255, 255, 255, .08);
  background: var(--fog-0);
}

.frame > * { position: relative; z-index: 2; }

/* glass pill nav */
.pillnav {
  display: flex; align-items: center; justify-content: space-between; gap: 1rem;
  padding: 1.35rem 1.6rem; flex-wrap: wrap;
}
.brandmark { display: flex; align-items: center; gap: .6rem; font-family: var(--head); font-weight: 700; font-size: 1.12rem; letter-spacing: .01em; }
.brandmark svg { flex: none; }
.pills {
  display: flex; align-items: center; gap: .2rem; padding: .3rem;
  border-radius: 999px; background: var(--glass); border: 1px solid var(--edge);
  backdrop-filter: blur(14px);
}
.pills a {
  font-size: .88rem; font-weight: 500; text-decoration: none; color: var(--muted);
  padding: .5rem 1.05rem; border-radius: 999px; transition: color .18s ease, background .18s ease;
}
.pills a:hover { color: var(--text); }
.pills a.on { background: #F4FAF9; color: #0B1413; font-weight: 600; }

/* headline + overlapping aircraft */
.headline {
  flex: 1; display: grid; place-items: center; padding: 1rem 1.5rem 0; text-align: center;
}
.headline h1 {
  font-family: var(--display);
  font-weight: 400;
  font-size: clamp(2.1rem, 9.2vw, 8rem);
  line-height: .96;
  letter-spacing: .01em;
  margin: 0;
  color: #FFF;
  text-shadow: 0 0 60px rgba(232, 251, 250, .28);
  mix-blend-mode: screen;
}
.headline .sub {
  font-family: var(--head); font-weight: 500;
  font-size: clamp(.95rem, 1.9vw, 1.32rem); letter-spacing: .02em;
  color: var(--muted); margin-top: 1rem; max-width: 32rem;
}

/* bottom bar inside the frame */
.framefoot {
  display: grid; grid-template-columns: minmax(16rem, 1fr) auto; gap: 1.5rem;
  align-items: end; padding: 1.6rem 1.6rem 1.75rem;
}
@media (max-width: 860px) { .framefoot { grid-template-columns: 1fr; align-items: start; } }

.framefoot .copy { color: var(--muted); font-size: 1rem; line-height: 1.55; max-width: 26rem; }
.cta { display: flex; gap: .65rem; margin-top: 1.15rem; flex-wrap: wrap; }
.btn {
  font-family: var(--body); font-size: .9rem; font-weight: 600; text-decoration: none;
  padding: .72rem 1.3rem; border-radius: 999px; transition: transform .16s ease, background .18s ease;
}
.btn.ghost { color: var(--text); border: 1px solid var(--edge-lit); background: var(--glass); backdrop-filter: blur(10px); }
.btn.ghost:hover { background: var(--glass-2); }
.btn.solid { background: #F4FAF9; color: #0B1413; }
.btn.solid:hover { transform: translateY(-1px); }

.statbar {
  display: flex; align-items: stretch; gap: 0;
  border-radius: var(--r); border: 1px solid var(--edge);
  background: var(--glass); backdrop-filter: blur(14px); overflow: hidden;
}
.stat { display: flex; align-items: center; gap: .8rem; padding: .95rem 1.25rem; }
.stat + .stat { border-left: 1px solid var(--edge); }
.stat .ic { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--edge); color: var(--cyan); flex: none; }
.stat .v { font-family: var(--head); font-weight: 600; font-size: 1.02rem; line-height: 1.15; }
.stat .l { font-size: .76rem; color: var(--faint); margin-top: .12rem; }
@media (max-width: 620px) { .statbar { flex-direction: column; } .stat + .stat { border-left: 0; border-top: 1px solid var(--edge); } }

/* ---------- shared surfaces ---------- */

.glass { background: var(--glass); border: 1px solid var(--edge); border-radius: var(--r); backdrop-filter: blur(10px); }

.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(17.5rem, 1fr)); gap: 1.1rem; margin-top: 2.4rem; }
.card { padding: 1.25rem 1.35rem; }
.card h3 { margin-bottom: .5rem; color: #F2F8F7; }
.card p { color: var(--muted); font-size: .95rem; }
.card.lit { border-color: rgba(53, 220, 216, .28); box-shadow: inset 0 0 40px -22px var(--cyan); }

/* telemetry strip */
.strip { margin-top: 2.6rem; overflow: hidden; }
.strip-head {
  display: flex; align-items: center; gap: .6rem; padding: .7rem 1.1rem;
  border-bottom: 1px solid var(--edge);
  font-family: var(--mono); font-size: .68rem; letter-spacing: .16em; text-transform: uppercase; color: var(--faint);
}
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--fail); flex: none; box-shadow: 0 0 12px var(--fail); }
@media (prefers-reduced-motion: no-preference) { .dot { animation: beat 1.5s ease-in-out infinite; } }
@keyframes beat { 0%,100% { opacity: 1; } 50% { opacity: .3; } }

.readouts { display: grid; grid-template-columns: repeat(auto-fit, minmax(8.6rem, 1fr)); }
.ro { padding: .9rem 1.1rem; border-right: 1px solid var(--edge); border-bottom: 1px solid var(--edge); }
.ro:last-child { border-right: 0; }
.ro dt { font-family: var(--mono); font-size: .62rem; letter-spacing: .15em; text-transform: uppercase; color: var(--faint); }
.ro dd { margin: .32rem 0 0; font-family: var(--head); font-size: 1.16rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.ro dd.bad { color: var(--fail); } .ro dd.warn { color: var(--caution); } .ro dd.ok { color: var(--pass); }
.strip-foot { padding: .8rem 1.1rem; font-family: var(--mono); font-size: .72rem; color: var(--muted); }

/* stages */
.steps { margin-top: 2.5rem; }
.step { display: grid; grid-template-columns: 3.1rem 1fr; gap: 1.25rem; align-items: start; }
.step + .step { margin-top: 1.6rem; padding-top: 1.6rem; border-top: 1px solid var(--edge); }
.step-n {
  font-family: var(--mono); font-size: .72rem; font-weight: 700; color: var(--cyan);
  border: 1px solid rgba(53, 220, 216, .4); border-radius: 999px; text-align: center;
  padding: .3rem 0; margin-top: .2rem; background: var(--cyan-soft);
}
.step-n.det { color: var(--muted); border-color: var(--edge); background: var(--glass); }
.step p { color: var(--muted); font-size: .96rem; margin-top: .4rem; }
.step .tools { margin-top: .6rem; font-family: var(--mono); font-size: .73rem; color: var(--faint); }

/* trace */
.trace { margin-top: 2.2rem; overflow: hidden; }
.trace-row { display: grid; grid-template-columns: 7rem 1fr; gap: 1rem; padding: .9rem 1.15rem; border-bottom: 1px solid var(--edge); align-items: baseline; }
.trace-row:last-child { border-bottom: 0; }
.trace-who { font-family: var(--mono); font-size: .63rem; letter-spacing: .14em; text-transform: uppercase; color: var(--faint); }
.trace-what { font-size: .95rem; color: var(--muted); }
.verdict { font-family: var(--mono); font-weight: 700; font-size: .75rem; letter-spacing: .07em; }
.verdict.pass { color: var(--pass); } .verdict.fail { color: var(--fail); } .verdict.warn { color: var(--caution); }
.trace-row.final { background: linear-gradient(90deg, var(--cyan-soft), transparent 70%); }
.trace-row.final .trace-what { color: var(--text); }

/* table */
.tablewrap { overflow-x: auto; margin-top: 2.2rem; }
table { border-collapse: collapse; width: 100%; font-size: .92rem; }
th, td { padding: .75rem 1.05rem; text-align: left; border-bottom: 1px solid var(--edge); white-space: nowrap; }
th { font-family: var(--mono); font-size: .63rem; letter-spacing: .15em; text-transform: uppercase; color: var(--faint); font-weight: 500; }
td { color: var(--muted); }
td.num { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
td.win { color: var(--cyan); font-weight: 600; }
td.lose { color: var(--fail); }
td.lead { color: var(--text); }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover td { background: rgba(255, 255, 255, .03); }

/* callout */
.callout { margin-top: 2.2rem; padding: 1.3rem 1.45rem; border-left: 2px solid var(--caution); }
.callout.cyan { border-left-color: var(--cyan); }
.callout.cyan h3 { color: var(--cyan); }
.callout h3 { color: var(--caution); font-size: .72rem; font-family: var(--mono); letter-spacing: .2em; text-transform: uppercase; }
.callout p { margin-top: .65rem; color: var(--muted); font-size: .96rem; }
.callout p + p { margin-top: .8rem; }
.quote { color: var(--text); font-size: .98rem; line-height: 1.65; font-style: italic; }

.note { margin-top: 2.4rem; font-size: .9rem; color: var(--faint); max-width: 42rem; }

figure { margin: 2.6rem 0 0; }
figcaption { margin-top: .9rem; font-size: .79rem; color: var(--faint); font-family: var(--mono); }
svg { display: block; max-width: 100%; height: auto; }

footer { padding: 3.5rem 0 5rem; color: var(--faint); font-size: .84rem; border-top: 1px solid var(--edge); }
footer .col { max-width: 54rem; }

:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; border-radius: 4px; }
